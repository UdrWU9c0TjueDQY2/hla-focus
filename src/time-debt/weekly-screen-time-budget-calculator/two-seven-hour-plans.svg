<svg xmlns="http://www.w3.org/2000/svg" width="560" height="608" viewBox="0 0 560 608" role="img" aria-labelledby="title desc"><title id="title">Two ways to plan seven hours of weekly screen time</title><desc id="desc">One plan allows 60 minutes every day. The other allows 30 minutes on weekdays and 135 minutes on weekend days. Both allow 420 minutes in the week.</desc><rect width="560" height="608" rx="20" fill="#f5f2fb"/><g font-family="system-ui,sans-serif" fill="#261d40"><text x="28" y="43" font-size="15" font-weight="700" letter-spacing="1.5">TIME DEBT  /  WEEKLY PLANNING</text><text x="28" y="92" font-size="38" font-weight="750">Two plans, seven hours</text><text x="28" y="121" font-size="19">Each bar shows minutes available that day.</text><rect x="16" y="148" width="528" height="190" rx="12" fill="white"/><text x="32" y="179" font-weight="700" font-size="22">The same time each day</text><rect x="38" y="261" width="44" height="39" rx="3" fill="#59459c"/><text x="60" y="254" text-anchor="middle" font-size="19" font-weight="700">60</text><text x="60" y="323" text-anchor="middle" font-size="17">M</text><rect x="111" y="261" width="44" height="39" rx="3" fill="#59459c"/><text x="133" y="254" text-anchor="middle" font-size="19" font-weight="700">60</text><text x="133" y="323" text-anchor="middle" font-size="17">Tu</text><rect x="184" y="261" width="44" height="39" rx="3" fill="#59459c"/><text x="206" y="254" text-anchor="middle" font-size="19" font-weight="700">60</text><text x="206" y="323" text-anchor="middle" font-size="17">W</text><rect x="257" y="261" width="44" height="39" rx="3" fill="#59459c"/><text x="279" y="254" text-anchor="middle" font-size="19" font-weight="700">60</text><text x="279" y="323" text-anchor="middle" font-size="17">Th</text><rect x="330" y="261" width="44" height="39" rx="3" fill="#59459c"/><text x="352" y="254" text-anchor="middle" font-size="19" font-weight="700">60</text><text x="352" y="323" text-anchor="middle" font-size="17">F</text><rect x="403" y="261" width="44" height="39" rx="3" fill="#037175"/><text x="425" y="254" text-anchor="middle" font-size="19" font-weight="700">60</text><text x="425" y="323" text-anchor="middle" font-size="17">Sa</text><rect x="476" y="261" width="44" height="39" rx="3" fill="#037175"/><text x="498" y="254" text-anchor="middle" font-size="19" font-weight="700">60</text><text x="498" y="323" text-anchor="middle" font-size="17">Su</text><rect x="16" y="348" width="528" height="190" rx="12" fill="white"/><text x="32" y="379" font-weight="700" font-size="22">More time on weekends</text><rect x="38" y="480.5" width="44" height="19.5" rx="3" fill="#59459c"/><text x="60" y="473.5" text-anchor="middle" font-size="19" font-weight="700">30</text><text x="60" y="523" text-anchor="middle" font-size="17">M</text><rect x="111" y="480.5" width="44" height="19.5" rx="3" fill="#59459c"/><text x="133" y="473.5" text-anchor="middle" font-size="19" font-weight="700">30</text><text x="133" y="523" text-anchor="middle" font-size="17">Tu</text><rect x="184" y="480.5" width="44" height="19.5" rx="3" fill="#59459c"/><text x="206" y="473.5" text-anchor="middle" font-size="19" font-weight="700">30</text><text x="206" y="523" text-anchor="middle" font-size="17">W</text><rect x="257" y="480.5" width="44" height="19.5" rx="3" fill="#59459c"/><text x="279" y="473.5" text-anchor="middle" font-size="19" font-weight="700">30</text><text x="279" y="523" text-anchor="middle" font-size="17">Th</text><rect x="330" y="480.5" width="44" height="19.5" rx="3" fill="#59459c"/><text x="352" y="473.5" text-anchor="middle" font-size="19" font-weight="700">30</text><text x="352" y="523" text-anchor="middle" font-size="17">F</text><rect x="403" y="412.25" width="44" height="87.75" rx="3" fill="#037175"/><text x="425" y="405.25" text-anchor="middle" font-size="19" font-weight="700">135</text><text x="425" y="523" text-anchor="middle" font-size="17">Sa</text><rect x="476" y="412.25" width="44" height="87.75" rx="3" fill="#037175"/><text x="498" y="405.25" text-anchor="middle" font-size="19" font-weight="700">135</text><text x="498" y="523" text-anchor="middle" font-size="17">Su</text><text x="28" y="577" font-size="19" font-weight="700">7 × 60 = (5 × 30) + (2 × 135) = 420 minutes</text></g></svg>